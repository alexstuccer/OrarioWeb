<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrarioWeb — pianificazione degli orari scolastici</title>
  <meta name="description" content="Costruzione dell'orario scolastico interamente nel browser: materie, docenti, classi, vincoli, generazione automatica e modifica manuale.">
  <style>
/* OrarioWeb — foglio di stile
   Idea guida: l'unico elemento "forte" è la griglia colorata dell'orario; tutto il resto è quieto.
   Il colore compare solo dove significa qualcosa: materie, conflitti, avvisi. */

:root {
  --sfondo: #f4f5f2;
  --pannello: #ffffff;
  --inchiostro: #22303c;
  --tenue: #6b7783;
  --linea: #d9dde1;
  --linea-forte: #b8c0c8;
  --accento: #2f5fd0;
  --accento-scuro: #23479c;
  --ok: #2e8b57;
  --avviso: #c98a00;
  --avviso-sfondo: #fff4d6;
  --errore: #c4342d;
  --errore-sfondo: #fde8e6;
  --raggio: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --testo: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: var(--testo)/1.45 var(--font);
  color: var(--inchiostro);
  background: var(--sfondo);
  -webkit-font-smoothing: antialiased;
}
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
h3 { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }
p { margin: 0 0 10px; }
a { color: var(--accento); }
small { color: var(--tenue); font-size: 12px; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: #eef0f2; padding: 1px 4px; border-radius: 3px; }
.intro { max-width: 70ch; color: var(--tenue); margin-bottom: 18px; }
.nota { color: var(--tenue); font-size: 13px; }
.vuoto { color: var(--tenue); font-style: italic; }
.ok { color: var(--ok); }
.avviso { color: var(--avviso); }
.errore { color: var(--errore); }

/* ---- controlli ---------------------------------------------------------- */
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--pannello);
  border: 1px solid var(--linea-forte);
  border-radius: var(--raggio);
  padding: 6px 12px;
  cursor: pointer;
  line-height: 1.3;
}
button:hover:not(:disabled) { border-color: var(--accento); color: var(--accento-scuro); }
button:disabled { opacity: 0.45; cursor: default; }
button.primario { background: var(--accento); border-color: var(--accento); color: #fff; }
button.primario:hover:not(:disabled) { background: var(--accento-scuro); border-color: var(--accento-scuro); color: #fff; }
button.testo { background: transparent; border-color: transparent; padding: 4px 8px; }
button.testo:hover:not(:disabled) { background: #eceff3; }
button.pericolo { color: var(--errore); }
button.pericolo:hover:not(:disabled) { border-color: var(--errore); background: var(--errore-sfondo); color: var(--errore); }
button.largo { width: 100%; text-align: left; }
button.mini { padding: 2px 7px; font-size: 12px; }
input[type="text"], input[type="number"], input[type="time"], select, textarea {
  background: var(--pannello);
  border: 1px solid var(--linea-forte);
  border-radius: var(--raggio);
  padding: 5px 8px;
}
input[type="number"] { width: 4.5em; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accento);
  outline-offset: 1px;
}
label { display: inline-flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--tenue); }
label > input, label > select { color: var(--inchiostro); }
.riga { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
.riga.spazio { margin-bottom: 14px; }
.riga-check { display: flex; flex-direction: row; align-items: center; gap: 8px; margin: 8px 0; color: var(--inchiostro); }
.azioni { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.blocco { display: flex; width: 100%; }
.blocco textarea { width: 100%; }

/* ---- struttura --------------------------------------------------------- */
.caricamento { padding: 40px; color: var(--tenue); }
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 52px;
  padding: 0 16px;
  background: var(--pannello);
  border-bottom: 1px solid var(--linea);
  position: sticky;
  top: 0;
  z-index: 5;
}
.marchio { font-weight: 700; letter-spacing: -0.02em; font-size: 16px; }
.nome-progetto {
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--raggio);
  padding: 4px 8px;
  font-size: 15px;
  width: min(34ch, 40vw);
}
.nome-progetto:hover, .nome-progetto:focus { border-color: var(--linea-forte); background: var(--pannello); }
.stato-salvataggio { color: var(--tenue); font-size: 12px; }
.stato-salvataggio.errore { color: var(--errore); }
.info-progetto { color: var(--tenue); font-size: 12px; }
.topbar-destra { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.versione {
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  padding: 3px 9px;
  border: 1px solid var(--linea);
  border-radius: 999px;
  background: var(--sfondo);
  white-space: nowrap;
}
.versione small { color: var(--tenue); }

.layout { display: grid; grid-template-columns: 236px 1fr; min-height: calc(100vh - 52px); }
.barra-laterale {
  background: var(--pannello);
  border-right: 1px solid var(--linea);
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow: auto;
}
.barra-laterale ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.barra-laterale .passo {
  width: 100%;
  background: transparent;
  border: 0;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: var(--raggio);
  color: var(--inchiostro);
  text-decoration: none;
}
.barra-laterale .passo:hover { background: #eef1f5; color: var(--inchiostro); }
.barra-laterale .passo.attivo { background: #e6ecfa; color: var(--accento-scuro); font-weight: 600; }
.barra-laterale .numero {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1px solid var(--linea-forte);
  display: inline-grid; place-items: center;
  font-size: 12px;
  color: var(--tenue);
  flex: none;
}
.barra-laterale .passo.attivo .numero { background: var(--accento); border-color: var(--accento); color: #fff; }
.collegamento { color: var(--accento); text-decoration: underline; padding: 0 2px; }
.conta { margin-left: auto; font-size: 12px; color: var(--tenue); font-weight: 400; font-variant-numeric: tabular-nums; }
.conta.lavoro { color: var(--accento); }
.azioni-progetto { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.contenuto { padding: 22px 28px 60px; min-width: 0; }

.pannello {
  background: var(--pannello);
  border: 1px solid var(--linea);
  border-radius: var(--raggio);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.errore-pagina { border-color: var(--errore); }
.due-colonne { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
.elenco { background: var(--pannello); border: 1px solid var(--linea); border-radius: var(--raggio); padding: 10px; }
.elenco ul { list-style: none; margin: 10px 0 0; padding: 0; max-height: 70vh; overflow: auto; }
.elenco .voce {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  border-color: transparent; background: transparent; text-align: left; padding: 6px 8px;
}
.elenco .voce:hover { background: #eef1f5; }
.elenco .voce.attiva { background: #e6ecfa; color: var(--accento-scuro); font-weight: 600; }
.carico { font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 6px; border-radius: 999px; background: #eef1f5; }
.carico.ok { background: #e2f3e9; color: var(--ok); }
.carico.diverso { background: var(--avviso-sfondo); color: var(--avviso); }
.carico.zero { color: var(--tenue); }
.carico.errore { background: var(--errore-sfondo); color: var(--errore); }

/* ---- tabelle ----------------------------------------------------------- */
.tabella { border-collapse: collapse; width: 100%; }
.tabella.stretta { width: auto; min-width: 40%; }
.tabella th, .tabella td { border-bottom: 1px solid var(--linea); padding: 6px 8px; text-align: left; vertical-align: middle; }
.tabella th { font-weight: 600; color: var(--tenue); font-size: 12px; }
.tabella td.fuori { background: repeating-linear-gradient(45deg, transparent 0 6px, #eceff3 6px 8px); }
.scorri-x { overflow-x: auto; }
.matrice th:first-child, .matrice td:first-child { position: sticky; left: 0; background: var(--pannello); z-index: 1; }
.matrice th { text-align: center; }
.matrice input[type="number"] { width: 3.6em; text-align: center; }
.matrice .totale { font-variant-numeric: tabular-nums; white-space: nowrap; }
.matrice .totale.errore { color: var(--errore); font-weight: 600; }
.matrice .totale.vuoto { color: var(--tenue); }
.sigla-materia {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 12px;
  color: #fff;
  background: var(--col, #64748b);
}
.elenco-semplice { margin: 0; padding-left: 20px; }
.lista { margin: 0; padding-left: 20px; }
.lista.errori li { color: var(--errore); }
.lista.avvisi li { color: #7a5a00; }
details summary { cursor: pointer; color: var(--tenue); }

/* assegnazioni */
.assegnazioni td.ass { min-width: 150px; }
.assegnazioni td.ass.mancante { background: var(--errore-sfondo); }
.assegnazioni td.ass select { max-width: 150px; display: block; margin-bottom: 4px; }
.assegnazioni .ass-ore { display: flex; gap: 8px; }
.assegnazioni .ass-ore label { flex-direction: row; align-items: center; gap: 4px; font-size: 12px; }
.assegnazioni .ass-ore input { width: 3.2em; padding: 2px 4px; }

/* chips materie */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; flex-direction: row; align-items: center; gap: 5px;
  padding: 3px 8px 3px 5px;
  border: 1px solid var(--linea-forte);
  border-left: 5px solid var(--col, var(--linea-forte));
  border-radius: var(--raggio);
  background: var(--pannello);
  color: var(--inchiostro);
  cursor: pointer;
}
.chip:has(input:checked) { background: #eef1f5; border-color: var(--inchiostro); border-left-color: var(--col, var(--inchiostro)); }

/* griglia disponibilità docente */
.griglia-disp { width: auto; }
.griglia-disp th, .griglia-disp td { text-align: center; }
.griglia-disp th small { display: block; font-weight: 400; }
.griglia-disp td.disp { width: 58px; height: 34px; cursor: pointer; user-select: none; font-weight: 600; border: 1px solid var(--linea); }
.disp.s0 { background: #e6f3ea; }
.disp.s1 { background: #f2c9c5; color: var(--errore); }
.disp.s2 { background: var(--avviso-sfondo); color: var(--avviso); }
.disp.libero { cursor: default; opacity: 0.7; }
.legenda { font-size: 13px; color: var(--tenue); margin-top: 8px; }
.legenda .disp { display: inline-block; width: 24px; text-align: center; margin: 0 4px 0 12px; border-radius: 3px; }

/* vincoli */
.vincoli { display: flex; flex-direction: column; gap: 6px; }
.vincolo { padding: 10px 0; border-bottom: 1px solid var(--linea); }
.vincolo:last-child { border-bottom: 0; }
.vincolo-testa { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.vincolo-peso { display: inline-flex; align-items: center; gap: 8px; }
.vincolo-peso input[type="range"] { width: 160px; accent-color: var(--accento); }
.vincolo-peso .estremo { font-size: 0.78em; color: var(--tenue); white-space: nowrap; }
.vincolo-peso output { width: 13em; text-align: left; font-variant-numeric: tabular-nums; font-weight: 600; }
.etichetta-peso { font-size: 0.85em; color: var(--tenue); text-transform: uppercase; letter-spacing: 0.04em; }
.riga.parametri { margin-top: 6px; align-items: center; }

/* genera */
.indicatori { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.indicatori > div { display: flex; flex-direction: column; padding: 10px 12px; border: 1px solid var(--linea); border-radius: var(--raggio); }
.indicatori .valore { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.indicatori .etichetta { color: var(--tenue); font-size: 12px; }

/* ---- orario: l'elemento protagonista ------------------------------------ */
.orario-testa { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 10px; }
.strumenti { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.strumenti .sep { width: 1px; height: 22px; background: var(--linea-forte); margin: 0 4px; }
.riepilogo { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; margin-bottom: 12px; color: var(--tenue); }
.riepilogo strong { color: var(--inchiostro); font-variant-numeric: tabular-nums; }
.orario-corpo { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.griglia-wrap { overflow-x: auto; background: var(--pannello); border: 1px solid var(--linea); border-radius: var(--raggio); padding: 8px; }

table.orario { border-collapse: separate; border-spacing: 3px; width: 100%; table-layout: fixed; }
table.orario th { font-weight: 600; color: var(--tenue); font-size: 13px; padding: 4px 2px; text-align: center; }
table.orario th.ora { width: 58px; text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; }
table.orario th.ora small { display: block; font-weight: 400; font-size: 11px; }
table.orario .badge { display: inline-block; font-size: 10px; font-weight: 600; color: var(--avviso); background: var(--avviso-sfondo); padding: 0 5px; border-radius: 999px; margin-left: 4px; }
table.orario td { height: 54px; border-radius: 4px; vertical-align: top; padding: 0; }
table.orario td.cella { background: #f7f8f6; border: 1px dashed var(--linea); }
table.orario td.fuori { background: repeating-linear-gradient(45deg, transparent 0 6px, #eceff3 6px 8px); }
table.orario td.buca { background: var(--avviso-sfondo); border-color: #e9c66a; }
table.orario td.indisp { background: repeating-linear-gradient(-45deg, #f2c9c5 0 4px, #f9e3e1 4px 8px); }
table.orario td.conflitto { border: 2px solid var(--errore); }
table.orario td.drop-ok { background: #d9efe1; border: 2px solid var(--ok); }
table.orario td.drop-warn { background: #fbe9bd; border: 2px solid var(--avviso); }
table.orario td.drop-no { background: #f6dcd9; border: 2px solid var(--errore); opacity: 0.8; }
table.orario td.sopra { filter: brightness(0.95); }

.lez {
  position: relative;
  display: flex; flex-direction: column;
  min-height: 52px;
  padding: 5px 24px 5px 10px;
  border-radius: 4px;
  border-left: 5px solid var(--col, #64748b);
  background: color-mix(in srgb, var(--col, #64748b) 14%, white);
  cursor: grab;
  line-height: 1.25;
}
.interattiva .lez:hover { background: color-mix(in srgb, var(--col, #64748b) 24%, white); }
.lez[draggable="false"] { cursor: default; }
.lez .sigla { font-weight: 700; font-size: 13px; }
.lez .dett { font-size: 11px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lez.blocco-inizio { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.lez.blocco-segue { border-top-left-radius: 0; border-top-right-radius: 0; }
.lez.blocco-segue .sigla, .lez.blocco-segue .dett { opacity: 0.55; }
.lez.conflitto { outline: 2px solid var(--errore); outline-offset: -2px; }
.lez.bloccata { background: color-mix(in srgb, var(--col, #64748b) 8%, #f3f4f6); cursor: default; }
.lez.trascinata { opacity: 0.4; }
.lez .lucchetto {
  position: absolute; top: 3px; right: 3px;
  border: 0; background: transparent; padding: 0 2px; font-size: 12px; line-height: 1;
  opacity: 0.35; cursor: pointer;
}
.lez:hover .lucchetto, .lez.bloccata .lucchetto { opacity: 1; }
td.conflitto .lez + .lez { margin-top: 2px; }

table.orario.globale td.mini {
  height: 26px; width: auto; text-align: center; font-size: 11px; font-weight: 600;
  background: color-mix(in srgb, var(--col, #64748b) 22%, white);
  border-left: 3px solid var(--col, #64748b);
}
table.orario.globale td.mini.vuota { background: #f7f8f6; border-left: 0; }
table.orario.globale th.ora-min { font-size: 10px; font-weight: 400; padding: 0; }
table.orario.globale { table-layout: auto; border-spacing: 2px; }

.diagnostica { background: var(--pannello); border: 1px solid var(--linea); border-radius: var(--raggio); padding: 12px 14px; max-height: calc(100vh - 140px); overflow: auto; }
.diagnostica .tabella td:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
.diagnostica tr.errore td { color: var(--errore); }
.diag-lista { list-style: none; margin: 0; padding: 0; }
.diag-lista li { border-bottom: 1px solid var(--linea); }
.diag-lista .testo { width: 100%; text-align: left; font-size: 13px; padding: 5px 6px; border-radius: 0; }

/* ---- toast e modale ------------------------------------------------------ */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
  background: var(--inchiostro); color: #fff; padding: 10px 16px; border-radius: var(--raggio);
  box-shadow: 0 6px 24px rgba(20, 30, 40, 0.25); opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s; max-width: min(90vw, 60ch); z-index: 20; font-size: 13px;
}
.toast.visibile { opacity: 1; transform: translate(-50%, 0); }
.toast.errore { background: var(--errore); }
.toast.avviso { background: #9a6b00; }
.toast.ok { background: var(--ok); }
.modale-sfondo { position: fixed; inset: 0; background: rgba(34, 48, 60, 0.45); display: grid; place-items: center; z-index: 30; padding: 20px; }
.modale { background: var(--pannello); border-radius: 10px; padding: 22px 24px; max-width: 560px; width: 100%; box-shadow: 0 20px 60px rgba(20, 30, 40, 0.3); }
.modale.larga { max-width: 820px; }
.avvio-errore { max-width: 60ch; margin: 60px auto; padding: 24px; background: var(--pannello); border: 1px solid var(--linea); border-radius: var(--raggio); }

/* ---- responsive ---------------------------------------------------------- */
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .barra-laterale { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--linea); }
  .barra-laterale ol { flex-direction: row; flex-wrap: wrap; }
  .azioni-progetto { flex-direction: row; flex-wrap: wrap; }
  .azioni-progetto .largo { width: auto; }
  .orario-corpo { grid-template-columns: 1fr; }
  .due-colonne { grid-template-columns: 1fr; }
  .contenuto { padding: 16px; }
  .info-progetto { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { transition: none; }
}

/* ---- stampa ------------------------------------------------------------- */
.solo-stampa { display: none; }
@media print {
  body { background: #fff; font-size: 11px; }
  .topbar, .barra-laterale, .strumenti, .riepilogo, .diagnostica, .toast, .modale-sfondo, .lucchetto { display: none !important; }
  .layout { display: block; }
  .contenuto { padding: 0; }
  .orario-corpo { display: block; }
  .griglia-wrap { border: 0; padding: 0; overflow: visible; }
  .solo-stampa { display: block; }
  h1 { display: none; }
  h2.solo-stampa { font-size: 14px; margin: 0 0 8px; }
  table.orario { page-break-inside: avoid; }
  table.orario td.cella { border: 1px solid #999; }
  .lez { background: #fff !important; border: 1px solid #666; border-left-width: 5px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pagina-stampa { page-break-after: always; }
  .pagina-stampa:last-child { page-break-after: auto; }
  body.stampa-tutte .griglia-wrap { display: none; }
  body.stampa-tutte #stampa-tutte-box { display: block; }
}

/* --- 0.2: indirizzi, profili, sezioni ------------------------------------ */
details.indirizzo { border: 1px solid var(--linea); border-radius: 6px; padding: 8px 12px; margin: 10px 0; background: #fbfbfa; }
details.indirizzo > summary { cursor: pointer; padding: 4px 0; }
details.indirizzo > summary .nota { margin-left: 6px; }
.sigla-ind { display: inline-block; font-size: 0.8em; font-weight: 600; padding: 1px 6px; border-radius: 3px; background: #eef1f5; margin-left: 4px; }
.quadro-ind th small { font-weight: 400; color: var(--tenue); }
.quadro-ind tfoot td { font-variant-numeric: tabular-nums; }
.quadro-ind tr.errore th { color: var(--errore); }
.profilo { border-top: 1px solid var(--linea); padding-top: 10px; margin-top: 10px; }
.sezioni .chips { gap: 4px; }
.sezioni .chip.oltre { opacity: 0.55; }
.sezioni td.azioni-riga { white-space: nowrap; }

motivo sono riportate solo le voci con fondamento normativo certo e le ore restanti sono raccolte nella materia AUT, che la scuola deve ripartire tra italiano, matematica, storia, geografia, scienze, tecnologia, arte e immagine, musica ed educazione fisica. REL: 2 ore in tutte le classi (DPR 751/1985, punto 2.3); stesso monte ore per l'attivita alternativa. ING: progressione 1-2-3-3-3 ore derivante da DM 61/2003 e CM 58/2003 e dall'organizzazione dell'organico, non da una tabella di rango primario. MOT: il DM 90/2022 ha introdotto il docente specialista di educazione motoria per non piu di 2 ore settimanali in classe quinta (dall'a.s. 2022/23) e in classe quarta (dall'a.s. 2023/24); il decreto le qualifica come ore AGGIUNTIVE per i modelli senza tempo pieno, quindi la scuola puo portare l'orario dell'alunno a 26 ore in quarta e quinta: qui sono state incluse nel monte ore di 24 per far tornare le somme. Nelle classi prima-terza l'educazione motoria e svolta dal docente di classe dentro la quota AUT. Educazione civica: almeno 33 ore annue trasversali (legge 92/2019, DM 183/2024), NON aggiuntive al monte ore. Quota di autonomia e flessibilita: fino al 20% del monte ore (DPR 275/1999 art. 8; DM 47/2006). Le nuove Indicazioni nazionali (DM 221/2025) non modificano il quadro orario. Regioni a statuto speciale e Province autonome di Trento e Bolzano: adattamenti propri (art. 6 DPR 89/2009).","sigla":"P24"},{"famiglia":"primo_ciclo","id":"primaria_27_ore","nome":"Scuola primaria - 27 ore settimanali","settore":null,"articolazioneDi":null,"anni":5,"monteOre":[27,27,27,27,27],"ore":{"REL":[2,2,2,2,2],"ING":[1,2,3,3,3],"MOT":[0,0,0,2,2],"AUT":[24,23,22,20,20]},"fonte":"DPR 89/2009, art. 4, commi 3-4; d.lgs. 59/2004, art. 7 comma 1","fonteUrl":"https://www.gazzettaufficiale.it/gunewsletter/dettaglio.jsp?service=1&datagu=2009-07-15&task=dettaglio&numgu=162&redaz=009G0099","verificato":true,"dataVerifica":"2026-09-05","note":"Modello a 27 ore corrispondente all'orario di cui all'art. 7 comma 1 del d.lgs. 59/2004, con esclusione delle attivita opzionali facoltative. Valgono tutte le avvertenze del modello a 24 ore: la ripartizione per disciplina NON e fissata per legge e le ore non vincolate sono raccolte in AUT.","sigla":"P27"},{"famiglia":"primo_ciclo","id":"primaria_30_ore","nome":"Scuola primaria - 30 ore settimanali","settore":null,"articolazioneDi":null,"anni":5,"monteOre":[30,30,30,30,30],"ore":{"REL":[2,2,2,2,2],"ING":[1,2,3,3,3],"MOT":[0,0,0,2,2],"AUT":[27,26,25,23,23]},"fonte":"DPR 89/2009, art. 4, commi 3-4","fonteUrl":"https://www.gazzettaufficiale.it/gunewsletter/dettaglio.jsp?service=1&datagu=2009-07-15&task=dettaglio&numgu=162&redaz=009G0099","verificato":true,"dataVerifica":"2026-09-05","note":"Il decreto parla di orario 27 sino a 30 ore: il modello a 30 ore e comprensivo delle attivita opzionali facoltative ed e attivabile nei limiti dell'organico assegnato. La ripartizione per disciplina NON e fissata per legge: le ore non vincolate sono raccolte in AUT.","sigla":"P30"},{"famiglia":"primo_ciclo","id":"primaria_40_ore","nome":"Scuola primaria - tempo pieno 40 ore","settore":null,"articolazioneDi":null,"anni":5,"monteOre":[40,40,40,40,40],"ore":{"REL":[2,2,2,2,2],"ING":[1,2,3,3,3],"MOT":[0,0,0,2,2],"AUT":[37,36,35,33,33]},"fonte":"DPR 89/2009, art. 4, commi 3-4 e comma 7","fonteUrl":"https://www.notiziedellascuola.it/legislazione-e-dottrina/indice-cronologico/2009/marzo/DPR_20090320_89/art4","verificato":true,"dataVerifica":"2026-09-05","note":"Tempo pieno: le 40 ore comprendono il tempo dedicato alla mensa. La quota di mensa e dopo-mensa non e fissata dal decreto: la scuola deve ricavarla dalla materia AUT (in genere 5 ore, una al giorno, fino a 10 ore includendo il dopo-mensa). L'attivazione e subordinata alla disponibilita di organico e di servizi. Nel tempo pieno le 2 ore di educazione motoria del DM 90/2022 rientrano nell'orario gia previsto (eventualmente in compresenza) e non sono aggiuntive. La ripartizione per disciplina NON e fissata per legge.","sigla":"P40"},{"famiglia":"primo_ciclo","id":"sec1g_tempo_normale","nome":"Scuola secondaria di I grado - tempo normale 30 ore","settore":null,"articolazioneDi":null,"anni":3,"monteOre":[30,30,30],"ore":{"LET":[9,9,9],"APP":[1,1,1],"MSC":[6,6,6],"TEC":[2,2,2],"ING":[3,3,3],"L2":[2,2,2],"MUS":[2,2,2],"MOT":[2,2,2],"REL":[1,1,1],"AIM":[2,2,2]},"fonte":"DPR 89/2009, art. 5, commi 1 e 5 (tabella degli insegnamenti); DM 37/2009 per organico e cattedre","fonteUrl":"https://www.gazzettaufficiale.it/gunewsletter/dettaglio.jsp?service=1&datagu=2009-07-15&task=dettaglio&numgu=162&redaz=009G0099","verificato":true,"dataVerifica":"2026-09-05","note":"Quadro orario FISSATO PER LEGGE dalla tabella dell'art. 5 comma 5 del DPR 89/2009, uguale per i tre anni. L'orario annuale obbligatorio e di 990 ore, pari a 29 ore settimanali, piu 33 ore annue (1 ora settimanale) di approfondimento in materie letterarie: totale 30 ore. LET e un BLOCCO UNICO di 9 ore denominato dal decreto Italiano, storia, geografia: la scomposizione interna (in genere italiano 5-6, storia 2, geografia 1-2) NON e fissata dalla norma ed e prassi organizzativa, quindi la scuola puo dividere LET in ITA/STO/GEO nel software. Stesso ragionamento per MSC (Matematica e scienze, 6 ore, cattedra unica). L'educazione civica e collocata nell'area storico-geografica (art. 5 comma 6), con almeno 33 ore annue trasversali non aggiuntive (legge 92/2019, DM 183/2024). Opzione art. 5 comma 10: a richiesta delle famiglie e compatibilmente con l'organico, le 2 ore di L2 possono essere usate per il potenziamento dell'inglese o dell'italiano per alunni stranieri. Le ore annue si ottengono moltiplicando le settimanali per 33. Latino per l'educazione linguistica (Nota MIM 1312/2026): dall'a.s. 2026/2027 opzionale in seconda e terza, da ricavare dagli spazi di autonomia e ampliamento dell'offerta formativa (indicativamente 1 ora aggiuntiva pomeridiana), senza modifica del quadro orario del DPR 89/2009.","sigla":"SM"},{"famiglia":"primo_ciclo","id":"sec1g_tempo_prolungato","nome":"Scuola secondaria di I grado - tempo prolungato","settore":null,"articolazioneDi":null,"anni":3,"monteOre":[38,38,38],"ore":{"LET":[15,15,15],"MSC":[9,9,9],"TEC":[2,2,2],"ING":[3,3,3],"L2":[2,2,2],"MUS":[2,2,2],"MOT":[2,2,2],"REL":[1,1,1],"AIM":[2,2,2]},"fonte":"DPR 89/2009, art. 5, commi 3, 4 e 8 (tabella degli insegnamenti del tempo prolungato)","fonteUrl":"https://www.gazzettaufficiale.it/gunewsletter/dettaglio.jsp?service=1&datagu=2009-07-15&task=dettaglio&numgu=162&redaz=009G0099","verificato":false,"dataVerifica":"2026-09-05","note":"DA VERIFICARE SUL TESTO DELLA GAZZETTA UFFICIALE prima dell'uso in produzione: la ricerca ha trovato formulazioni discordanti sulla riga finale della tabella dell'art. 5 comma 8. ATTENZIONE alla distinzione tra due numeri diversi: l'orario dell'ALUNNO e di 36 ore settimanali (elevabili in via eccezionale fino a 40 su richiesta maggioritaria delle famiglie e in presenza di mensa e rientri pomeridiani), mentre la CONSISTENZA ORARIA DI ORGANICO e di 38 ore (art. 5 comma 3). Qui monteOre e impostato a 38 perche e il numero di ore di insegnamento da collocare effettivamente nell'orario; le 2 ore di differenza rispetto alle 36 dell'alunno corrispondono a compresenze e all'assistenza durante la mensa. Se il software deve rappresentare l'orario dell'alunno anziche quello dei docenti, ridurre a 36 e documentare la scelta. Rispetto al tempo normale le ore aggiuntive vanno al blocco letterario (da 9+1 a 15) e a matematica e scienze (da 6 a 9); nel tempo prolungato non compare la voce autonoma di approfondimento. Il tempo mensa rientra nel computo delle 36/40 ore. In mancanza di servizi e strutture idonei le classi sono ricondotte all'orario normale (art. 5 comma 4).","sigla":"SMP"},{"famiglia":"primo_ciclo","id":"sec1g_indirizzo_musicale","nome":"Scuola secondaria di I grado - sezione a indirizzo musicale","settore":null,"articolazioneDi":"sec1g_tempo_normale","anni":3,"monteOre":[33,33,33],"ore":{"LET":[9,9,9],"APP":[1,1,1],"MSC":[6,6,6],"TEC":[2,2,2],"ING":[3,3,3],"L2":[2,2,2],"MUS":[2,2,2],"MOT":[2,2,2],"REL":[1,1,1],"STR":[3,3,3],"AIM":[2,2,2]},"fonte":"DPR 89/2009, art. 5 comma 5, integrato dal DM interministeriale 1 luglio 2022, n. 176, art. 4","fonteUrl":"","verificato":true,"dataVerifica":"2026-09-05","note":"URL ufficiale del DM 176/2022 non catturato in fase di ricerca: da inserire. Il DM 176/2022 (in vigore dall'a.s. 2023/2024, in sostituzione progressiva del DM 201/1999) prevede all'art. 4 comma 1 che le attivita si svolgano in orario AGGIUNTIVO rispetto al quadro orario dell'art. 5 comma 5 del DPR 89/2009, per tre ore settimanali (99 ore annue), anche articolate in unita di insegnamento non coincidenti con l'unita oraria e organizzate anche su base plurisettimanale, corrispondenti a sei ore settimanali di insegnamento del docente per ciascun sottogruppo. Le tre ore (materia STR) comprendono lezione strumentale individuale e collettiva, teoria e lettura della musica, musica d'insieme. Sono collocate in orario non coincidente con quello delle altre discipline, in genere pomeridiano: da qui preferenzaOra estremi. La scuola puo modulare le ore nel triennio rispettando la media di 3 ore settimanali. Per il solver: STR va trattata come attivita per sottogruppi di alunni (non per classe intera) e richiede aule di strumento dedicate.","sigla":"SMM"},{"famiglia":"licei","id":"liceo_classico","nome":"Liceo classico","settore":null,"articolazioneDi":null,"anni":5,"monteOre":[27,27,31,31,31],"ore":{"ITA":[4,4,4,4,4],"LAT":[5,5,4,4,4],"GRE":[4,4,3,3,3],"ING":[3,3,3,3,3],"SGE":[3,3,0,0,0],"STO":[0,0,3,3,3],"FIL":[0,0,3,3,3],"MAT":[3,3,2,2,2],"FIS":[0,0,2,2,2],"SCI":[2,2,2,2,2],"ART":[0,0,2,2,2],"MOT":[2,2,2,2,2],"REL":[1,1,1,1,1]},"fonte":"DPR 89/2010, allegato C","fonteUrl":"https://www.edscuola.it/archivio/norme/programmi/2ciclo_quadriorario_19505.pdf","verificato":true,"dataVerifica":"2026-09-05","note":"Ore annue del decreto divise per 33. Matematica con informatica nel primo biennio. Educazione civica: 33 ore annue trasversali non aggiuntive (legge 92/2019). CLIL: una disciplina non linguistica in lingua straniera nel quinto anno. Quota di autonomia fino al 20% del monte ore. La lingua straniera e scelta dalla scuola (di norma inglese).","sigla":"LC"},{"famiglia":"licei","id":"liceo_scientifico","nome":"Liceo scientifico","settore":null,"articolazioneDi":null,"anni":5,"monteOre":[27,27,30,30,30],"ore":{"ITA":[4,4,4,4,4],"LAT":[3,3,3,3,3],"ING":[3,3,3,3,3],"SGE":[3,3,0,0,0],"STO":[0,0,2,2,2],"FIL":[0,0,3,3,3],"MAT":[5,5,4,4,4],"FIS":[2,2,3,3,3],"SCI":[2,2,3,3,3],"DSA":[2,2,2,2,2],"MOT":[2,2,2,2,2],"REL":[1,1,1,1,1]},"fonte":"DPR 89/2010, allegato F","fonteUrl":"https://www.edscuola.it/archivio/norme/programmi/2ciclo_quadriorario_19505.pdf","verificato":true,"dataVerifica":"2026-09-05","note":"Matematica con informatica nel primo biennio. Educazione civica 33 ore trasversali non aggiuntive; CLIL al quinto anno; quota di autonomia 20%. DSA (disegno e storia dell'arte, classe A17) e materia distinta da ART (storia dell'arte, A54) usata in classico, linguistico e scienze umane.","sigla":"LS"},{"famiglia":"licei","id":"liceo_scientifico_scienze_applicate","nome":"Liceo scientifico - opzione scienze applicate","settore":null,"articolazioneDi":"liceo_scientifico","anni":5,"monteOre":[27,27,30,30,30],"ore":{"ITA":[4,4,4,4,4],"ING":[3,3,3,3,3],"SGE":[3,3,0,0,0],"STO":[0,0,2,2,2],"FIL":[0,0,2,2,2],"MAT":[5,4,4,4,4],"INF":[2,2,2,2,2],"FIS":[2,2,3,3,3],"SCI":[3,4,5,5,5],"DSA":[2,2,2,2,2],"MOT":[2,2,2,2,2],"REL":[1,1,1,1,1]},"fonte":"DPR 89/2010, allegato F (opzione scienze applicate)","fonteUrl":"https://www.edscuola.it/archivio/norme/programmi/2ciclo_quadriorario_19505.pdf","verificato":true,"dataVerifica":"2026-09-05","note":"Rispetto allo scientifico ordinario: niente latino, informatica per cinque anni, scienze naturali potenziate (3-4-5-5-5), matematica 5-4-4-4-4 e filosofia 2 ore nel triennio. Struttura verificata; i singoli valori di matematica, scienze e informatica sono stati riscontrati su piu fonti ma e consigliata una conferma sul PDF dell'allegato F. Educazione civica, CLIL e autonomia come per lo scientifico.","sigla":"LSA"},{"famiglia":"licei","id":"liceo_scientifico_sportivo","nome":"Liceo scientifico - sezione a indirizzo sportivo","settore":null,"articolazioneDi":"liceo_scientifico","anni":5,"monteOre":[27,27,30,30,30],"ore":{"ITA":[4,4,4,4,4],"ING":[3,3,3,3,3],"SGE":[3,3,0,0,0],"STO":[0,0,2,2,2],"FIL":[0,0,2,2,2],"MAT":[5,5,4,4,4],"FIS":[2,2,3,3,3],"SCI":[3,3,3,3,3],"DES":[0,0,3,3,3],"MOT":[3,3,3,3,3],"DSP":[3,3,2,2,2],"REL":[1,1,1,1,1]},"fonte":"DPR 5 marzo 2013 n. 52, allegato (piano degli studi), G.U. n. 113 del 16/05/2013","fonteUrl":"","verificato":true,"dataVerifica":"2026-09-05","note":"URL della Gazzetta Ufficiale non catturato in fase di ricerca: da inserire. Niente latino e niente disegno e storia dell'arte; scienze motorie 3 ore in tutti gli anni; discipline sportive 3-3-2-2-2; diritto ed economia dello sport 3 ore nel triennio; filosofia ridotta a 2 ore. Le discipline sportive e le scienze motorie richiedono palestra e impianti sportivi: per il solver vanno marcate come materie con aula speciale.","sigla":"LSS"},{"famiglia":"licei","id":"liceo_linguistico","nome":"Liceo linguistico","settore":null,"articolazioneDi":null,"anni":5,"monteOre":[27,27,30,30,30],"ore":{"ITA":[4,4,4,4,4],"LAT":[2,2,0,0,0],"ING":[4,4,3,3,3],"L2":[3,3,4,4,4],"L3":[3,3,4,4,4],"SGE":[3,3,0,0,0],"STO":[0,0,2,2,2],"FIL":[0,0,2,2,2],"MAT":[3,3,2,2,2],"FIS":[0,0,2,2,2],"SCI":[2,2,2,2,2],"ART":[0,0,2,2,2],"MOT":[2,2,2,2,2],"REL":[1,1,1,1,1]},"fonte":"DPR 89/2010, allegato D","fonteUrl":"https://www.edscuola.it/archivio/norme/programmi/2ciclo_quadriorario_19505.pdf","verificato":true,"dataVerifica":"2026-09-05","note":"ING rappresenta la lingua e cultura straniera 1 (di norma inglese, ma la scelta delle tre lingue spetta alla scuola). Per ciascuna delle tre lingue 33 ore annue (1 ora settimanale) sono svolte in compresenza con il docente di conversazione madrelingua e sono COMPRESE nel monte ore della lingua: per il solver, 1 ora a settimana di ING, L2 e L3 e una compresenza (docente + conversatore). Latino solo nel primo biennio. CLIL: una disciplina in lingua 1 dal terzo anno e una seconda disciplina in lingua 2 dal quarto anno. Educazione civica 33 ore trasversali; autonomia 20%.","sigla":"LL"},{"famiglia":"licei","id":"liceo_scienze_umane","nome":"Liceo delle scienze umane","settore":null,"articolazioneDi":null,"anni":5,"monteOre":[27,27,30,30,30],"ore":{"ITA":[4,4,4,4,4],"LAT":[3,3,2,2,2],"ING":[3,3,3,3,3],"SCU":[4,4,5,5,5],"DIR":[2,2,0,0,0],"SGE":[3,3,0,0,0],"STO":[0,0,2,2,2],"FIL":[0,0,3,3,3],"MAT":[3,3,2,2,2],"FIS":[0,0,2,2,2],"SCI":[2,2,2,2,2],"ART":[0,0,2,2,2],"MOT":[2,2,2,2,2],"REL":[1,1,1,1,1]},"fonte":"DPR 89/2010, allegato G","fonteUrl":"https://www.edscuola.it/archivio/norme/programmi/2ciclo_quadriorario_19505.pdf","verificato":true,"dataVerifica":"2026-09-05","note":"Scienze umane: pedagogia e psicologia nel primo biennio; pedagogia, antropologia, sociologia e psicologia nel secondo biennio; pedagogia, antropologia e sociologia al quinto anno (unica materia SCU, classe A18). DIR qui e Diritto ed economia, solo nel primo biennio. Educazione civica 33 ore trasversali; CLIL al quinto anno; autonomia 20%.","sigla":"LSU"},{"famiglia":"licei","id":"liceo_scienze_umane_economico_sociale","nome":"Liceo delle scienze umane - opzione economico-sociale (LES)","settore":null,"articolazioneDi":"liceo_scienze_umane","anni":5,"monteOre":[27,27,30,30,30],"ore":{"ITA":[4,4,4,4,4],"ING":[3,3,3,3,3],"L2":[3,3,3,3,3],"SCU":[3,3,3,3,3],"DIR":[3,3,3,3,3],"SGE":[3,3,0,0,0],"STO":[0,0,2,2,2],"FIL":[0,0,2,2,2],"MAT":[3,3,3,3,3],"FIS":[0,0,2,2,2],"SCI":[2,2,0,0,0],"ART":[0,0,2,2,2],"MOT":[2,2,2,2,2],"REL":[1,1,1,1,1]},"fonte":"DPR 89/2010, allegato G (opzione economico-sociale); art. 9 comma 3","fonteUrl":"https://www.edscuola.it/a     $("#undo", main).addEventListener("click", undo);
    $("#redo", main).addEventListener("click", redo);
    ui.tastiera = (e) => {
      if (!(e.ctrlKey || e.metaKey) || e.target.matches("input, textarea, select")) return;
      if (e.key === "z" && !e.shiftKey) {
        e.preventDefault();
        undo();
      } else if (e.key === "y" || e.key === "z" && e.shiftKey) {
        e.preventDefault();
        redo();
      }
    };
    $("#rigenera", main).addEventListener("click", () => {
      ui.riparti = true;
      ctx2.vai("genera");
    });
    const righeElenco = () => {
      const righe = [["Classe", "Giorno", "Ora", "Inizio", "Materia", "Sigla", "Docente", "Bloccata"]];
      const bloc = bloccate();
      for (let l = 0; l < p.lezioni.length; l++) {
        const s = st.slots[l];
        if (s < 0) continue;
        const lz = p.lezioni[l];
        const g = s / mo | 0;
        const h0 = s - g * mo;
        for (let k = 0; k < lz.durata; k++) {
          righe.push([p.classi[lz.classe].id, p.giorni[g], h0 + k + 1, etichettaOra(pr, h0 + k), p.materie[lz.materia].nome, p.materie[lz.materia].id, lz.docenti.map((d) => p.docenti[d].nome).join(" + "), bloc.has(lz.id) ? "sì" : ""]);
        }
      }
      const testa = righe.shift();
      righe.sort((a, b) => a[0].localeCompare(b[0]) || p.giorni.indexOf(a[1]) - p.giorni.indexOf(b[1]) || a[2] - b[2]);
      return [testa, ...righe];
    };
    const matrice = (vista) => {
      const testa1 = [vista === "docente" ? "Docente" : "Classe"];
      const testa2 = [""];
      for (let g = 0; g < p.nGiorni; g++) for (let h = 0; h < p.orePerGiorno[g]; h++) {
        testa1.push(h === 0 ? p.giorni[g] : "");
        testa2.push(`${h + 1}ª`);
      }
      const righe = [testa1, testa2];
      const n = vista === "docente" ? p.nDoc : p.nCl;
      for (let i = 0; i < n; i++) {
        const celle = mappaCelle(vista, i);
        const r = [vista === "docente" ? p.docenti[i].nome : p.classi[i].id];
        for (let g = 0; g < p.nGiorni; g++) for (let h = 0; h < p.orePerGiorno[g]; h++) {
          const ls = celle.get(g * mo + h) ?? [];
          r.push(ls.map((l) => vista === "docente" ? p.classi[p.lezioni[l].classe].id : p.materie[p.lezioni[l].materia].id).join("/"));
        }
        righe.push(r);
      }
      return righe;
    };
    $("#csv", main).addEventListener("click", () => {
      const righe = righeElenco();
      const csv = righe.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(";")).join("\r\n");
      scaricaFile(nomeFileProgetto("_orario").replace(/\.json$/, ".csv"), "\uFEFF" + csv, "text/csv;charset=utf-8");
      toast("CSV esportato (separatore ; per Excel)");
    });
    $("#xlsx", main).addEventListener("click", () => {
      const nOre = p.orePerGiorno.reduce((s, x) => s + x, 0);
      const largh = (prima) => [prima, ...new Array(nOre).fill(6)];
      const fogli = [
        { nome: "Docenti", righe: matrice("docente"), larghezze: largh(24) },
        { nome: "Classi", righe: matrice("classe"), larghezze: largh(10) },
        { nome: "Elenco", righe: righeElenco(), larghezze: [10, 8, 6, 8, 30, 8, 30, 10] }
      ];
      scaricaFile(nomeFileProgetto("_orario").replace(/\.json$/, ".xlsx"), scriviXlsx(fogli), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      toast("Excel esportato: fogli Docenti, Classi, Elenco");
    });
    delega(main, "click", "#versione-salva", () => {
      const nome = prompt("Nome della versione", `Versione ${pr.orari.length + 1}`);
      if (nome === null) return;
      const v = salvaVersioneOrario(pr, nome);
      ctx2.salva();
      disegna();
      toast(`Orario salvato come "${v.nome}"`);
    });
    delega(main, "click", "#versione-carica", () => {
      const id = $("#versione-sel", main)?.value;
      const v = pr.orari.find((o) => o.id === id);
      if (!v) return;
      if (!versioneCorrente(pr) && !confirm("L'orario attuale non è salvato come versione e verrà sostituito. Continuare?")) return;
      caricaVersioneOrario(pr, id);
      ui.undo = [];
      ui.redo = [];
      ctx2.salva();
      ctx2.rerender();
      toast(`Versione "${v.nome}" caricata`);
    });
    delega(main, "click", "#versione-elimina", () => {
      const id = $("#versione-sel", main)?.value;
      const v = pr.orari.find((o) => o.id === id);
      if (!v || !confirm(`Eliminare la versione "${v.nome}"?`)) return;
      pr.orari = pr.orari.filter((o) => o !== v);
      ctx2.salva();
      disegna();
    });
    const stampaBlocco = (html) => {
      const box = $("#stampa-tutte-box", main);
      box.innerHTML = html;
      document.body.classList.add("stampa-tutte");
      const fine = () => {
        document.body.classList.remove("stampa-tutte");
        box.innerHTML = "";
        window.removeEventListener("afterprint", fine);
      };
      window.addEventListener("afterprint", fine);
      window.print();
    };
    $("#stampa-docenti", main).addEventListener("click", () => stampaBlocco(p.docenti.map((d, i) => `<section class="pagina-stampa">${htmlGriglia("docente", i, false)}</section>`).join("")));
    $("#stampa", main).addEventListener("click", () => window.print());
    $("#stampa-tutte", main).addEventListener("click", () => stampaBlocco(p.classi.map((c, i) => `<section class="pagina-stampa">${htmlGriglia("classe", i, false)}</section>`).join("")));
    disegna();
  }

  // js/app.js
  var PASSI = [
    { id: "istituto", mod: step_istituto_exports },
    { id: "sezioni", mod: step_sezioni_exports },
    { id: "classi", mod: step_classi_exports },
    { id: "materie", mod: step_materie_exports },
    { id: "docenti", mod: step_docenti_exports },
    { id: "assegnazioni", mod: step_assegnazioni_exports },
    { id: "vincoli", mod: step_vincoli_exports },
    { id: "genera", mod: step_genera_exports },
    { id: "orario", mod: step_orario_exports }
  ];
  window.addEventListener("error", (e) => registraErrore(e.error ?? new Error(e.message), "window"));
  window.addEventListener("unhandledrejection", (e) => registraErrore(e.reason ?? new Error("promise rifiutata"), "promise"));
  function validaConfig(c) {
    if (!c || typeof c !== "object") throw new Error("il file non contiene un oggetto JSON");
    if (typeof c.versione !== "number") throw new Error('manca il campo "versione"');
    for (const k of ["vincoli", "setPesi"]) if (!Array.isArray(c[k])) throw new Error(`manca l'elenco "${k}"`);
    if (!c.solver || typeof c.solver !== "object") throw new Error('manca la sezione "solver"');
    for (const v of c.vincoli) if (!v.id || typeof v.peso !== "number") throw new Error(`vincolo senza id o peso: ${JSON.stringify(v).slice(0, 60)}`);
    c.segnalazioni ??= { email: "" };
    return c;
  }
  function validaQuadri(q) {
    const errori = controllaQuadri(q);
    if (errori.length) throw new Error(errori.slice(0, 3).join("; ") + (errori.length > 3 ? ` (e altri ${errori.length - 3})` : ""));
    return q;
  }
  async function caricaFile(nome, globale, valida2) {
    if (globalThis[globale]) return valida2(JSON.parse(JSON.stringify(globalThis[globale])));
    const r = await fetch("./" + nome, { cache: "no-cache" });
    if (!r.ok) throw new Error(`${nome}: HTTP ${r.status}`);
    return valida2(await r.json());
  }
  var caricaConfig = () => caricaFile("config.json", "__ORARIOWEB_CONFIG__", validaConfig);
  var caricaQuadri = () => caricaFile("quadri-orari.json", "__ORARIOWEB_QUADRI__", validaQuadri);
  function ctx() {
    return {
      store,
      config: store.config,
      quadri: store.quadri,
      project: store.project,
      salva: () => {
        salva();
        aggiornaShell();
      },
      rerender: render10,
      vai,
      aggiornaShell
    };
  }
  function vai(id, extra) {
    if (!PASSI.some((p) => p.id === id)) id = "istituto";
    store.ui.passo = id;
    if (extra) Object.assign(store.ui, extra);
    try {
      if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    } catch (e) {
    }
    render10();
  }
  function etichettaPasso(id) {
    const pr = store.project;
    const n = (x) => `<span class="conta">${x}</span>`;
    switch (id) {
      case "istituto":
        return `Istituto ${pr.indirizzi.length ? n(pr.indirizzi.length + (pr.indirizzi.length === 1 ? " indirizzo" : " indirizzi")) : ""}`;
      case "sezioni":
        return `Sezioni ${pr.sezioni.length ? n(pr.sezioni.length) : ""}`;
      case "materie":
        return `Materie ${pr.materie.length ? n(pr.materie.length) : ""}`;
      case "docenti":
        return `Docenti ${pr.docenti.length ? n(pr.docenti.length) : ""}`;
      case "classi":
        return `Classi ${pr.classi.length ? n(pr.classi.length) : ""}`;
      case "assegnazioni": {
        const tot = pr.classi.reduce((s, c) => s + Object.values(c.quadroOrario).filter((x) => x > 0).length, 0);
        const fatte = pr.assegnazioni.filter((a) => a.docenti.length && pr.classi.some((c) => c.id === a.classe && (c.quadroOrario[a.materia] | 0) > 0)).length;
        return `Assegnazioni ${tot ? n(`${fatte}/${tot}`) : ""}`;
      }
      case "vincoli":
        return "Vincoli";
      case "genera":
        return `Genera ${store.ui.gen?.attivo ? '<span class="conta lavoro">in corso</span>' : ""}`;
      case "orario":
        return `Orario ${pr.soluzione ? n(pr.soluzione.punteggio.rigido ? pr.soluzione.punteggio.rigido + " conflitti" : "ok") : ""}`;
      default:
        return id;
    }
  }
  function aggiornaShell() {
    const pr = store.project;
    if (!pr) return;
    const nav = $("#passi");
    if (nav) {
      nav.innerHTML = PASSI.map((p, i) => `<li><button type="button" class="passo ${store.ui.passo === p.id ? "attivo" : ""}" data-vai="${p.id}"><span class="numero">${i + 1}</span>${etichettaPasso(p.id)}</button></li>`).join("");
    }
    const nome = $("#nome-progetto-top");
    if (nome && nome.value !== pr.meta.nome) nome.value = pr.meta.nome;
    const doc = pr.docenti.length ? `${pr.docenti.reduce((s, d) => s + oreDocente(pr, d.id), 0)} ore assegnate` : "";
    const info = $("#info-progetto");
    if (info) info.textContent = doc;
  }
  function shell() {
    return `
    <header class="topbar">
      <div class="marchio">OrarioWeb</div>
      <input id="nome-progetto-top" class="nome-progetto" type="text" value="${esc(store.project.meta.nome)}" aria-label="Nome del progetto" maxlength="80">
      <span id="stato-salvataggio" class="stato-salvataggio"></span>
      <span id="info-progetto" class="info-progetto"></span>
      <div class="topbar-destra">
        <button id="btn-bug" class="testo" title="Mostra gli errori registrati in un messaggio da copiare e inviare">Rileva bug</button>
        <span class="versione" title="Versione dell'applicazione (${DATA_VERSIONE}) e della configurazione">v${esc(VERSIONE)} <small>config ${esc(String(store.config.versione))}</small></span>
      </div>
    </header>
    <div class="layout">
      <nav class="barra-laterale" aria-label="Passi">
        <ol id="passi"></ol>
        <div class="azioni-progetto">
          <button id="btn-esporta" class="largo" title="Scarica il progetto completo (dati e orario) come file .json: è il tuo backup">Esporta progetto (.json)</button>
          <button id="btn-importa" class="largo">Importa progetto</button>
          <button id="btn-nuovo" class="largo testo">Nuovo progetto</button>
          <button id="btn-config" class="largo testo" title="Carica un altro config.json (vincoli, solver)">Importa configurazione</button>
          <button id="btn-quadri" class="largo testo" title="Carica un altro quadri-orari.json (catalogo degli indirizzi di studio); vale per questa sessione">Importa quadri orari</button>
        </div>
      </nav>
      <main id="main" class="contenuto"></main>
    </div>`;
  }
  function render10() {
    const passo = PASSI.find((p) => p.id === store.ui.passo) ?? PASSI[0];
    store.ui.tastiera = null;
    aggiornaShell();
    const vecchio = $("#main");
    const main = document.createElement("main");
    main.id = "main";
    main.className = "contenuto";
    vecchio.replaceWith(main);
    window.scrollTo(0, 0);
    try {
      passo.mod.render(main, ctx());
    } catch (e) {
      registraErrore(e, "render " + passo.id);
      main.innerHTML = `<div class="pannello errore-pagina"><h2>Questa pagina non si è disegnata correttamente</h2><p>${esc(e.message)}</p><p>Prova a ricaricare. Se il problema resta, usa "Rileva bug" in alto a destra: il messaggio include i dettagli tecnici.</p></div>`;
    }
    document.title = `${store.project.meta.nome} — OrarioWeb`;
  }
  function collegaShell() {
    $("#btn-bug").addEventListener("click", apriSegnalazione);
    $("#nome-progetto-top").addEventListener("change", (e) => {
      store.project.meta.nome = e.target.value.trim() || "Nuovo istituto";
      salva();
      render10();
    });
    $("#btn-esporta").addEventListener("click", () => {
      salva(true);
      scaricaFile(nomeFileProgetto(), esporta());
      toast("Progetto esportato: conserva il file come backup");
    });
    $("#btn-importa").addEventListener("click", async () => {
      const f = await leggiFile();
      if (!f) return;
      if (store.project.classi.length && !confirm("Importare il file sostituisce il progetto attuale (che resta nei tuoi backup esportati). Continuare?")) return;
      try {
        importa(f.testo, store.config, store.quadri);
        vai("istituto");
        toast(`Progetto "${store.project.meta.nome}" importato`);
      } catch (e) {
        registraErrore(e, "importa");
        toast("File non valido: " + e.message, "errore", 6e3);
      }
    });
    $("#btn-nuovo").addEventListener("click", () => {
      if (store.project.classi.length || store.project.docenti.length) {
        if (!confirm("Creare un nuovo progetto vuoto? Quello attuale verrà sostituito: esportalo prima se vuoi conservarlo.")) return;
      }
      nuovo(store.config);
      vai("istituto");
      toast("Nuovo progetto creato");
    });
    $("#btn-config").addEventListener("click", async () => {
      const f = await leggiFile();
      if (!f) return;
      try {
        store.config = validaConfig(JSON.parse(f.testo));
        $(".versione small").textContent = `config ${store.config.versione}`;
        render10();
        toast(`Configurazione ${store.config.versione} caricata (vale per questa sessione)`);
      } catch (e) {
        registraErrore(e, "importa config");
        toast("Configurazione non valida: " + e.message, "errore", 6e3);
      }
    });
    $("#btn-quadri").addEventListener("click", async () => {
      const f = await leggiFile();
      if (!f) return;
      try {
        store.quadri = validaQuadri(JSON.parse(f.testo));
        render10();
        toast(`Quadri orari caricati: ${store.quadri.indirizzi.length} indirizzi (valgono per questa sessione; gli indirizzi già nel progetto non cambiano)`, "info", 6e3);
      } catch (e) {
        registraErrore(e, "importa quadri");
        toast("Quadri orari non validi: " + e.message, "errore", 8e3);
      }
    });
    store.onErrore = (voce) => {
      aggiornaPulsanteBug();
      if (voce.contesto === "salvataggio locale" || voce.contesto === "quadri") return;
      toast(`Errore rilevato (${voce.contesto || "generico"}): ${voce.messaggio.slice(0, 90)}. Usa "Rileva bug" in alto a destra per copiare il rapporto.`, "errore", 8e3);
    };
    aggiornaPulsanteBug();
    store.onSalvato = (quando, errore) => {
      const el = $("#stato-salvataggio");
      if (!el) return;
      if (errore) {
        el.textContent = "Salvataggio locale non riuscito: esporta il progetto";
        el.className = "stato-salvataggio errore";
      } else {
        el.textContent = `Salvato ${quando.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })}`;
        el.className = "stato-salvataggio";
      }
    };
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-vai]");
      if (b) {
        e.preventDefault();
        vai(b.dataset.vai);
      }
    });
    window.addEventListener("hashchange", () => {
      const id = location.hash.slice(1);
      if (id && id !== store.ui.passo) vai(id);
    });
    document.addEventListener("keydown", (e) => store.ui.tastiera?.(e));
    window.addEventListener("beforeunload", (e) => {
      if (store.ui.gen?.attivo) {
        e.preventDefault();
        e.returnValue = "";
      }
    });
  }
  function schermataErroreConfig(e) {
    $("#app").innerHTML = `
    <div class="avvio-errore">
      <h1>OrarioWeb <small>v${esc(VERSIONE)}</small></h1>
      <p>Non riesco a leggere <code>config.json</code>: ${esc(e.message)}.</p>
      <p>Se hai aperto <code>index.html</code> direttamente da una cartella (indirizzo che inizia con <code>file://</code>), il browser blocca la lettura dei file: avvia un piccolo server locale come descritto nel README, oppure carica la configurazione a mano.</p>
      <button id="btn-config-avvio" class="primario">Carica config.json</button>
      <button id="btn-bug-avvio" class="testo">Rileva bug</button>
    </div>`;
    $("#btn-config-avvio").addEventListener("click", async () => {
      const f = await leggiFile();
      if (!f) return;
      try {
        avviaCon(validaConfig(JSON.parse(f.testo)), null);
      } catch (err) {
        registraErrore(err, "config manuale");
        toast("Configurazione non valida: " + err.message, "errore", 6e3);
      }
    });
    $("#btn-bug-avvio").addEventListener("click", apriSegnalazione);
  }
  function avviaCon(config, quadri) {
    store.config = config;
    store.quadri = quadri ?? { schema: "orarioweb-quadri-orari", versione: 0, materie: [], indirizzi: [] };
    store.project = caricaLocale(config, store.quadri) ?? nuovo(config);
    $("#app").innerHTML = shell();
    collegaShell();
    const id = location.hash.slice(1);
    store.ui.passo = PASSI.some((p) => p.id === id) ? id : "istituto";
    if (!store.project.classi.length && !store.project.docenti.length && !id) benvenuto();
    render10();
    if (store.ultimoSalvataggio) store.onSalvato(store.ultimoSalvataggio, null);
  }
  function benvenuto() {
    const { chiudi } = modale(`
    <h2>Benvenuto in OrarioWeb</h2>
    <p>Costruisci l'orario in nove passi, dall'alto in basso nella colonna a sinistra: istituto (griglia, indirizzi di studio, profili orari), sezioni, classi, materie, docenti, assegnazioni, vincoli, generazione, orario.</p>
    <p>Tutto viene salvato automaticamente in questo browser. Per un backup che sopravviva alla cancellazione dei dati del browser usa <strong>Esporta progetto</strong>: il file contiene anche l'orario.</p>
    <div class="azioni"><button class="primario" data-chiudi>Comincia</button></div>`);
    void chiudi;
  }
  async function avvia2() {
    let config;
    try {
      config = await caricaConfig();
    } catch (e) {
      registraErrore(e, "config");
      schermataErroreConfig(e);
      return;
    }
    let quadri = null;
    try {
      quadri = await caricaQuadri();
    } catch (e) {
      registraErrore(e, "quadri");
      setTimeout(() => toast("Catalogo dei quadri orari non caricato: " + e.message + '. Usa "Importa quadri orari".', "avviso", 8e3), 300);
    }
    avviaCon(config, quadri);
  }
  avvia2();
})();

</script>
