<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrarioWeb — pianificazione degli orari scolastici</title>
  <meta name="description" content="Costruzione dell'orario scolastico interamente nel browser: materie, docenti, classi, vincoli, generazione automatica e modifica manuale.">
  <style>
/* OrarioWeb — foglio di stile
   Idea guida: l'unico elemento "forte" è la griglia colorata dell'orario; tutto il resto è quieto.
   Il colore compare solo dove significa qualcosa: materie, conflitti, avvisi. */

:root {
  --sfondo: #f4f5f2;
  --pannello: #ffffff;
  --inchiostro: #22303c;
  --tenue: #6b7783;
  --linea: #d9dde1;
  --linea-forte: #b8c0c8;
  --accento: #2f5fd0;
  --accento-scuro: #23479c;
  --ok: #2e8b57;
  --avviso: #c98a00;
  --avviso-sfondo: #fff4d6;
  --errore: #c4342d;
  --errore-sfondo: #fde8e6;
  --raggio: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --testo: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: var(--testo)/1.45 var(--font);
  color: var(--inchiostro);
  background: var(--sfondo);
  -webkit-font-smoothing: antialiased;
}
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
h3 { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }
p { margin: 0 0 10px; }
a { color: var(--accento); }
small { color: var(--tenue); font-size: 12px; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: #eef0f2; padding: 1px 4px; border-radius: 3px; }
.intro { max-width: 70ch; color: var(--tenue); margin-bottom: 18px; }
.nota { color: var(--tenue); font-size: 13px; }
.vuoto { color: var(--tenue); font-style: italic; }
.ok { color: var(--ok); }
.avviso { color: var(--avviso); }
.errore { color: var(--errore); }

/* ---- controlli ---------------------------------------------------------- */
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--pannello);
  border: 1px solid var(--linea-forte);
  border-radius: var(--raggio);
  padding: 6px 12px;
  cursor: pointer;
  line-height: 1.3;
}
button:hover:not(:disabled) { border-color: var(--accento); color: var(--accento-scuro); }
button:disabled { opacity: 0.45; cursor: default; }
button.primario { background: var(--accento); border-color: var(--accento); color: #fff; }
button.primario:hover:not(:disabled) { background: var(--accento-scuro); border-color: var(--accento-scuro); color: #fff; }
button.testo { background: transparent; border-color: transparent; padding: 4px 8px; }
button.testo:hover:not(:disabled) { background: #eceff3; }
button.pericolo { color: var(--errore); }
button.pericolo:hover:not(:disabled) { border-color: var(--errore); background: var(--errore-sfondo); color: var(--errore); }
button.largo { width: 100%; text-align: left; }
button.mini { padding: 2px 7px; font-size: 12px; }
input[type="text"], input[type="number"], input[type="time"], select, textarea {
  background: var(--pannello);
  border: 1px solid var(--linea-forte);
  border-radius: var(--raggio);
  padding: 5px 8px;
}
input[type="number"] { width: 4.5em; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accento);
  outline-offset: 1px;
}
label { display: inline-flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--tenue); }
label > input, label > select { color: var(--inchiostro); }
.riga { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
.riga.spazio { margin-bottom: 14px; }
.riga-check { display: flex; flex-direction: row; align-items: center; gap: 8px; margin: 8px 0; color: var(--inchiostro); }
.azioni { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.blocco { display: flex; width: 100%; }
.blocco textarea { width: 100%; }

/* ---- struttura --------------------------------------------------------- */
.caricamento { padding: 40px; color: var(--tenue); }
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 52px;
  padding: 0 16px;
  background: var(--pannello);
  border-bottom: 1px solid var(--linea);
  position: sticky;
  top: 0;
  z-index: 5;
}
.marchio { font-weight: 700; letter-spacing: -0.02em; font-size: 16px; }
.nome-progetto {
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--raggio);
  padding: 4px 8px;
  font-size: 15px;
  width: min(34ch, 40vw);
}
.nome-progetto:hover, .nome-progetto:focus { border-color: var(--linea-forte); background: var(--pannello); }
.stato-salvataggio { color: var(--tenue); font-size: 12px; }
.stato-salvataggio.errore { color: var(--errore); }
.info-progetto { color: var(--tenue); font-size: 12px; }
.topbar-destra { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.versione {
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  padding: 3px 9px;
  border: 1px solid var(--linea);
  border-radius: 999px;
  background: var(--sfondo);
  white-space: nowrap;
}
.versione small { color: var(--tenue); }

.layout { display: grid; grid-template-columns: 236px 1fr; min-height: calc(100vh - 52px); }
.barra-laterale {
  background: var(--pannello);
  border-right: 1px solid var(--linea);
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow: auto;
}
.barra-laterale ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.barra-laterale .passo {
  width: 100%;
  background: transparent;
  border: 0;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: var(--raggio);
  color: var(--inchiostro);
  text-decoration: none;
}
.barra-laterale .passo:hover { background: #eef1f5; color: var(--inchiostro); }
.barra-laterale .passo.attivo { background: #e6ecfa; color: var(--accento-scuro); font-weight: 600; }
.barra-laterale .numero {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1px solid var(--linea-forte);
  display: inline-grid; place-items: center;
  font-size: 12px;
  color: var(--tenue);
  flex: none;
}
.barra-laterale .passo.attivo .numero { background: var(--accento); border-color: var(--accento); color: #fff; }
.collegamento { color: var(--accento); text-decoration: underline; padding: 0 2px; }
.conta { margin-left: auto; font-size: 12px; color: var(--tenue); font-weight: 400; font-variant-numeric: tabular-nums; }
.conta.lavoro { color: var(--accento); }
.azioni-progetto { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.contenuto { padding: 22px 28px 60px; min-width: 0; }

.pannello {
  background: var(--pannello);
  border: 1px solid var(--linea);
  border-radius: var(--raggio);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.errore-pagina { border-color: var(--errore); }
.due-colonne { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
.elenco { background: var(--pannello); border: 1px solid var(--linea); border-radius: var(--raggio); padding: 10px; }
.elenco ul { list-style: none; margin: 10px 0 0; padding: 0; max-height: 70vh; overflow: auto; }
.elenco .voce {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  border-color: transparent; background: transparent; text-align: left; padding: 6px 8px;
}
.elenco .voce:hover { background: #eef1f5; }
.elenco .voce.attiva { background: #e6ecfa; color: var(--accento-scuro); font-weight: 600; }
.carico { font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 6px; border-radius: 999px; background: #eef1f5; }
.carico.ok { background: #e2f3e9; color: var(--ok); }
.carico.diverso { background: var(--avviso-sfondo); color: var(--avviso); }
.carico.zero { color: var(--tenue); }
.carico.errore { background: var(--errore-sfondo); color: var(--errore); }

/* ---- tabelle ----------------------------------------------------------- */
.tabella { border-collapse: collapse; width: 100%; }
.tabella.stretta { width: auto; min-width: 40%; }
.tabella th, .tabella td { border-bottom: 1px solid var(--linea); padding: 6px 8px; text-align: left; vertical-align: middle; }
.tabella th { font-weight: 600; color: var(--tenue); font-size: 12px; }
.tabella td.fuori { background: repeating-linear-gradient(45deg, transparent 0 6px, #eceff3 6px 8px); }
.scorri-x { overflow-x: auto; }
.matrice th:first-child, .matrice td:first-child { position: sticky; left: 0; background: var(--pannello); z-index: 1; }
.matrice th { text-align: center; }
.matrice input[type="number"] { width: 3.6em; text-align: center; }
.matrice .totale { font-variant-numeric: tabular-nums; white-space: nowrap; }
.matrice .totale.errore { color: var(--errore); font-weight: 600; }
.matrice .totale.vuoto { color: var(--tenue); }
.sigla-materia {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 12px;
  color: #fff;
  background: var(--col, #64748b);
}
.elenco-semplice { margin: 0; padding-left: 20px; }
.lista { margin: 0; padding-left: 20px; }
.lista.errori li { color: var(--errore); }
.lista.avvisi li { color: #7a5a00; }
details summary { cursor: pointer; color: var(--tenue); }

/* assegnazioni */
.assegnazioni td.ass { min-width: 150px; }
.assegnazioni td.ass.mancante { background: var(--errore-sfondo); }
.assegnazioni td.ass select { max-width: 150px; display: block; margin-bottom: 4px; }
.assegnazioni .ass-ore { display: flex; gap: 8px; }
.assegnazioni .ass-ore label { flex-direction: row; align-items: center; gap: 4px; font-size: 12px; }
.assegnazioni .ass-ore input { width: 3.2em; padding: 2px 4px; }

/* chips materie */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; flex-direction: row; align-items: center; gap: 5px;
  padding: 3px 8px 3px 5px;
  border: 1px solid var(--linea-forte);
  border-left: 5px solid var(--col, var(--linea-forte));
  border-radius: var(--raggio);
  background: var(--pannello);
  color: var(--inchiostro);
  cursor: pointer;
}
.chip:has(input:checked) { background: #eef1f5; border-color: var(--inchiostro); border-left-color: var(--col, var(--inchiostro)); }

/* griglia disponibilità docente */
.griglia-disp { width: auto; }
.griglia-disp th, .griglia-disp td { text-align: center; }
.griglia-disp th small { display: block; font-weight: 400; }
.griglia-disp td.disp { width: 58px; height: 34px; cursor: pointer; user-select: none; font-weight: 600; border: 1px solid var(--linea); }
.disp.s0 { background: #e6f3ea; }
.disp.s1 { background: #f2c9c5; color: var(--errore); }
.disp.s2 { background: var(--avviso-sfondo); color: var(--avviso); }
.disp.libero { cursor: default; opacity: 0.7; }
.legenda { font-size: 13px; color: var(--tenue); margin-top: 8px; }
.legenda .disp { display: inline-block; width: 24px; text-align: center; margin: 0 4px 0 12px; border-radius: 3px; }

/* vincoli */
.vincoli { display: flex; flex-direction: column; gap: 6px; }
.vincolo { padding: 10px 0; border-bottom: 1px solid var(--linea); }
.vincolo:last-child { border-bottom: 0; }
.vincolo-testa { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.vincolo-peso { display: inline-flex; align-items: center; gap: 8px; }
.vincolo-peso input[type="range"] { width: 200px; accent-color: var(--accento); }
.vincolo-peso output { width: 2.5em; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* genera */
.indicatori { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.indicatori > div { display: flex; flex-direction: column; padding: 10px 12px; border: 1px solid var(--linea); border-radius: var(--raggio); }
.indicatori .valore { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.indicatori .etichetta { color: var(--tenue); font-size: 12px; }

/* ---- orario: l'elemento protagonista ------------------------------------ */
.orario-testa { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 10px; }
.strumenti { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.strumenti .sep { width: 1px; height: 22px; background: var(--linea-forte); margin: 0 4px; }
.riepilogo { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; margin-bottom: 12px; color: var(--tenue); }
.riepilogo strong { color: var(--inchiostro); font-variant-numeric: tabular-nums; }
.orario-corpo { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.griglia-wrap { overflow-x: auto; background: var(--pannello); border: 1px solid var(--linea); border-radius: var(--raggio); padding: 8px; }

table.orario { border-collapse: separate; border-spacing: 3px; width: 100%; table-layout: fixed; }
table.orario th { font-weight: 600; color: var(--tenue); font-size: 13px; padding: 4px 2px; text-align: center; }
table.orario th.ora { width: 58px; text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; }
table.orario th.ora small { display: block; font-weight: 400; font-size: 11px; }
table.orario .badge { display: inline-block; font-size: 10px; font-weight: 600; color: var(--avviso); background: var(--avviso-sfondo); padding: 0 5px; border-radius: 999px; margin-left: 4px; }
table.orario td { height: 54px; border-radius: 4px; vertical-align: top; padding: 0; }
table.orario td.cella { background: #f7f8f6; border: 1px dashed var(--linea); }
table.orario td.fuori { background: repeating-linear-gradient(45deg, transparent 0 6px, #eceff3 6px 8px); }
table.orario td.buca { background: var(--avviso-sfondo); border-color: #e9c66a; }
table.orario td.indisp { background: repeating-linear-gradient(-45deg, #f2c9c5 0 4px, #f9e3e1 4px 8px); }
table.orario td.conflitto { border: 2px solid var(--errore); }
table.orario td.drop-ok { background: #d9efe1; border: 2px solid var(--ok); }
table.orario td.drop-warn { background: #fbe9bd; border: 2px solid var(--avviso); }
table.orario td.drop-no { background: #f6dcd9; border: 2px solid var(--errore); opacity: 0.8; }
table.orario td.sopra { filter: brightness(0.95); }

.lez {
  position: relative;
  display: flex; flex-direction: column;
  min-height: 52px;
  padding: 5px 24px 5px 10px;
  border-radius: 4px;
  border-left: 5px solid var(--col, #64748b);
  background: color-mix(in srgb, var(--col, #64748b) 14%, white);
  cursor: grab;
  line-height: 1.25;
}
.interattiva .lez:hover { background: color-mix(in srgb, var(--col, #64748b) 24%, white); }
.lez[draggable="false"] { cursor: default; }
.lez .sigla { font-weight: 700; font-size: 13px; }
.lez .dett { font-size: 11px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lez.blocco-inizio { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.lez.blocco-segue { border-top-left-radius: 0; border-top-right-radius: 0; }
.lez.blocco-segue .sigla, .lez.blocco-segue .dett { opacity: 0.55; }
.lez.conflitto { outline: 2px solid var(--errore); outline-offset: -2px; }
.lez.bloccata { background: color-mix(in srgb, var(--col, #64748b) 8%, #f3f4f6); cursor: default; }
.lez.trascinata { opacity: 0.4; }
.lez .lucchetto {
  position: absolute; top: 3px; right: 3px;
  border: 0; background: transparent; padding: 0 2px; font-size: 12px; line-height: 1;
  opacity: 0.35; cursor: pointer;
}
.lez:hover .lucchetto, .lez.bloccata .lucchetto { opacity: 1; }
td.conflitto .lez + .lez { margin-top: 2px; }

table.orario.globale td.mini {
  height: 26px; width: auto; text-align: center; font-size: 11px; font-weight: 600;
  background: color-mix(in srgb, var(--col, #64748b) 22%, white);
  border-left: 3px solid var(--col, #64748b);
}
table.orario.globale td.mini.vuota { background: #f7f8f6; border-left: 0; }
table.orario.globale th.ora-min { font-size: 10px; font-weight: 400; padding: 0; }
table.orario.globale { table-layout: auto; border-spacing: 2px; }

.diagnostica { background: var(--pannello); border: 1px solid var(--linea); border-radius: var(--raggio); padding: 12px 14px; max-height: calc(100vh - 140px); overflow: auto; }
.diagnostica .tabella td:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
.diagnostica tr.errore td { color: var(--errore); }
.diag-lista { list-style: none; margin: 0; padding: 0; }
.diag-lista li { border-bottom: 1px solid var(--linea); }
.diag-lista .testo { width: 100%; text-align: left; font-size: 13px; padding: 5px 6px; border-radius: 0; }

/* ---- toast e modale ------------------------------------------------------ */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
  background: var(--inchiostro); color: #fff; padding: 10px 16px; border-radius: var(--raggio);
  box-shadow: 0 6px 24px rgba(20, 30, 40, 0.25); opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s; max-width: min(90vw, 60ch); z-index: 20; font-size: 13px;
}
.toast.visibile { opacity: 1; transform: translate(-50%, 0); }
.toast.errore { background: var(--errore); }
.toast.avviso { background: #9a6b00; }
.toast.ok { background: var(--ok); }
.modale-sfondo { position: fixed; inset: 0; background: rgba(34, 48, 60, 0.45); display: grid; place-items: center; z-index: 30; padding: 20px; }
.modale { background: var(--pannello); border-radius: 10px; padding: 22px 24px; max-width: 560px; width: 100%; box-shadow: 0 20px 60px rgba(20, 30, 40, 0.3); }
.modale.larga { max-width: 820px; }
.avvio-errore { max-width: 60ch; margin: 60px auto; padding: 24px; background: var(--pannello); border: 1px solid var(--linea); border-radius: var(--raggio); }

/* ---- responsive ---------------------------------------------------------- */
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .barra-laterale { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--linea); }
  .barra-laterale ol { flex-direction: row; flex-wrap: wrap; }
  .azioni-progetto { flex-direction: row; flex-wrap: wrap; }
  .azioni-progetto .largo { width: auto; }
  .orario-corpo { grid-template-columns: 1fr; }
  .due-colonne { grid-template-columns: 1fr; }
  .contenuto { padding: 16px; }
  .info-progetto { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { transition: none; }
}

/* ---- stampa ------------------------------------------------------------- */
.solo-stampa { display: none; }
@media print {
  body { background: #fff; font-size: 11px; }
  .topbar, .barra-laterale, .strumenti, .riepilogo, .diagnostica, .toast, .modale-sfondo, .lucchetto { display: none !important; }
  .layout { display: block; }
  .contenuto { padding: 0; }
  .orario-corpo { display: block; }
  .griglia-wrap { border: 0; padding: 0; overflow: visible; }
  .solo-stampa { display: block; }
  h1 { display: none; }
  h2.solo-stampa { font-size: 14px; margin: 0 0 8px; }
  table.orario { page-break-inside: avoid; }
  table.orario td.cella { border: 1px solid #999; }
  .lez { background: #fff !important; border: 1px solid #666; border-left-width: 5px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pagina-stampa { page-break-after: always; }
  .pagina-stampa:last-child { page-break-after: auto; }
  body.stampa-tutte .griglia-wrap { display: none; }
  body.stampa-tutte #stampa-tutte-box { display: block; }
}

/* --- 0.2: indirizzi, profili, sezioni ------------------------------------ */
details.indirizzo { border: 1px solid var(--linea); border-radius: 6px; padding: 8px 12px; margin: 10px 0; background: #fbfbfa; }
details.indirizzo > summary { cursor: pointer; padding: 4px 0; }
details.indirizzo > summary .nota { margin-left: 6px; }
.sigla-ind { display: inline-block; font-size: 0.8em; font-weight: 600; padding: 1px 6px; border-radius: 3px; background: #eef1f5; margin-left: 4px; }
.quadro-ind th small { font-weight: 400; color: var(--tenue); }
.quadro-ind tfoot td { font-variant-numeric: tabular-nums; }
.quadro-ind tr.errore th { color: var(--errore); }
.profilo { border-top: 1px solid var(--linea); padding-top: 10px; margin-top: 10px; }
.sezioni .chips { gap: 4px; }
.sezioni .chip.oltre { opacity: 0.55; }
.sezioni td.azioni-riga { white-space: nowrap; }
table.orario td.cella.fuori-profilo .lez { outline: 2px dashed var(--errore); }
table.orario td.mini.fuori { background: repeating-linear-gradient(45deg, transparent 0 4px, #eceff3 4px 6px); }
.riga .sep { flex: 1; }

</style>
</head>
<body>

          <button id="btn-esporta" class="largo" title="Scarica il progetto completo (dati e orario) come file .json: è il tuo backup">Esporta progetto (.json)</button>
          <button id="btn-importa" class="largo">Importa progetto</button>
          <button id="btn-nuovo" class="largo testo">Nuovo progetto</button>
          <button id="btn-config" class="largo testo" title="Carica un altro config.json (vincoli, solver)">Importa configurazione</button>
          <button id="btn-quadri" class="largo testo" title="Carica un altro quadri-orari.json (catalogo degli indirizzi di studio); vale per questa sessione">Importa quadri orari</button>
        </div>
      </nav>
      <main id="main" class="contenuto"></main>
    </div>`;
  }
  function render10() {
    const passo = PASSI.find((p) => p.id === store.ui.passo) ?? PASSI[0];
    store.ui.tastiera = null;
    aggiornaShell();
    const vecchio = $("#main");
    const main = document.createElement("main");
    main.id = "main";
    main.className = "contenuto";
    vecchio.replaceWith(main);
    window.scrollTo(0, 0);
    try {
      passo.mod.render(main, ctx());
    } catch (e) {
      registraErrore(e, "render " + passo.id);
      main.innerHTML = `<div class="pannello errore-pagina"><h2>Questa pagina non si è disegnata correttamente</h2><p>${esc(e.message)}</p><p>Prova a ricaricare. Se il problema resta, usa "Segnala un bug": il rapporto include i dettagli tecnici.</p></div>`;
    }
    document.title = `${store.project.meta.nome} — OrarioWeb`;
  }
  function collegaShell() {
    $("#btn-bug").addEventListener("click", apriSegnalazione);
    $("#nome-progetto-top").addEventListener("change", (e) => {
      store.project.meta.nome = e.target.value.trim() || "Nuovo istituto";
      salva();
      render10();
    });
    $("#btn-esporta").addEventListener("click", () => {
      salva(true);
      scaricaFile(nomeFileProgetto(), esporta());
      toast("Progetto esportato: conserva il file come backup");
    });
    $("#btn-importa").addEventListener("click", async () => {
      const f = await leggiFile();
      if (!f) return;
      if (store.project.classi.length && !confirm("Importare il file sostituisce il progetto attuale (che resta nei tuoi backup esportati). Continuare?")) return;
      try {
        importa(f.testo, store.config, store.quadri);
        vai("istituto");
        toast(`Progetto "${store.project.meta.nome}" importato`);
      } catch (e) {
        registraErrore(e, "importa");
        toast("File non valido: " + e.message, "errore", 6e3);
      }
    });
    $("#btn-nuovo").addEventListener("click", () => {
      if (store.project.classi.length || store.project.docenti.length) {
        if (!confirm("Creare un nuovo progetto vuoto? Quello attuale verrà sostituito: esportalo prima se vuoi conservarlo.")) return;
      }
      nuovo(store.config);
      vai("istituto");
      toast("Nuovo progetto creato");
    });
    $("#btn-config").addEventListener("click", async () => {
      const f = await leggiFile();
      if (!f) return;
      try {
        store.config = validaConfig(JSON.parse(f.testo));
        $(".versione small").textContent = `config ${store.config.versione}`;
        render10();
        toast(`Configurazione ${store.config.versione} caricata (vale per questa sessione)`);
      } catch (e) {
        registraErrore(e, "importa config");
        toast("Configurazione non valida: " + e.message, "errore", 6e3);
      }
    });
    $("#btn-quadri").addEventListener("click", async () => {
      const f = await leggiFile();
      if (!f) return;
      try {
        store.quadri = validaQuadri(JSON.parse(f.testo));
        render10();
        toast(`Quadri orari caricati: ${store.quadri.indirizzi.length} indirizzi (valgono per questa sessione; gli indirizzi già nel progetto non cambiano)`, "info", 6e3);
      } catch (e) {
        registraErrore(e, "importa quadri");
        toast("Quadri orari non validi: " + e.message, "errore", 8e3);
      }
    });
    store.onSalvato = (quando, errore) => {
      const el = $("#stato-salvataggio");
      if (!el) return;
      if (errore) {
        el.textContent = "Salvataggio locale non riuscito: esporta il progetto";
        el.className = "stato-salvataggio errore";
      } else {
        el.textContent = `Salvato ${quando.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })}`;
        el.className = "stato-salvataggio";
      }
    };
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-vai]");
      if (b) {
        e.preventDefault();
        vai(b.dataset.vai);
      }
    });
    window.addEventListener("hashchange", () => {
      const id = location.hash.slice(1);
      if (id && id !== store.ui.passo) vai(id);
    });
    document.addEventListener("keydown", (e) => store.ui.tastiera?.(e));
    window.addEventListener("beforeunload", (e) => {
      if (store.ui.gen?.attivo) {
        e.preventDefault();
        e.returnValue = "";
      }
    });
  }
  function schermataErroreConfig(e) {
    $("#app").innerHTML = `
    <div class="avvio-errore">
      <h1>OrarioWeb <small>v${esc(VERSIONE)}</small></h1>
      <p>Non riesco a leggere <code>config.json</code>: ${esc(e.message)}.</p>
      <p>Se hai aperto <code>index.html</code> direttamente da una cartella (indirizzo che inizia con <code>file://</code>), il browser blocca la lettura dei file: avvia un piccolo server locale come descritto nel README, oppure carica la configurazione a mano.</p>
      <button id="btn-config-avvio" class="primario">Carica config.json</button>
      <button id="btn-bug-avvio" class="testo">Segnala un bug</button>
    </div>`;
    $("#btn-config-avvio").addEventListener("click", async () => {
      const f = await leggiFile();
      if (!f) return;
      try {
        avviaCon(validaConfig(JSON.parse(f.testo)), null);
      } catch (err) {
        registraErrore(err, "config manuale");
        toast("Configurazione non valida: " + err.message, "errore", 6e3);
      }
    });
    $("#btn-bug-avvio").addEventListener("click", apriSegnalazione);
  }
  function avviaCon(config, quadri) {
    store.config = config;
    store.quadri = quadri ?? { schema: "orarioweb-quadri-orari", versione: 0, materie: [], indirizzi: [] };
    store.project = caricaLocale(config, store.quadri) ?? nuovo(config);
    $("#app").innerHTML = shell();
    collegaShell();
    const id = location.hash.slice(1);
    store.ui.passo = PASSI.some((p) => p.id === id) ? id : "istituto";
    if (!store.project.classi.length && !store.project.docenti.length && !id) benvenuto();
    render10();
    if (store.ultimoSalvataggio) store.onSalvato(store.ultimoSalvataggio, null);
  }
  function benvenuto() {
    const { chiudi } = modale(`
    <h2>Benvenuto in OrarioWeb</h2>
    <p>Costruisci l'orario in nove passi, dall'alto in basso nella colonna a sinistra: istituto (griglia, indirizzi di studio, profili orari), sezioni, classi, materie, docenti, assegnazioni, vincoli, generazione, orario.</p>
    <p>Tutto viene salvato automaticamente in questo browser. Per un backup che sopravviva alla cancellazione dei dati del browser usa <strong>Esporta progetto</strong>: il file contiene anche l'orario.</p>
    <div class="azioni"><button class="primario" data-chiudi>Comincia</button></div>`);
    void chiudi;
  }
  async function avvia2() {
    let config;
    try {
      config = await caricaConfig();
    } catch (e) {
      registraErrore(e, "config");
      schermataErroreConfig(e);
      return;
    }
    let quadri = null;
    try {
      quadri = await caricaQuadri();
    } catch (e) {
      registraErrore(e, "quadri");
      setTimeout(() => toast("Catalogo dei quadri orari non caricato: " + e.message + '. Usa "Importa quadri orari".', "avviso", 8e3), 300);
    }
    avviaCon(config, quadri);
  }
  avvia2();
})();

</script>
</body>
</html>
